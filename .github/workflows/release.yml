name: Release

# A tag v1.2.3 builds, tests and packages every platform and publishes a GitHub release.
# Only official upstream binaries go in: nfqws2/winws2, WinDivert, cygwin1.dll and lua from the bol-van/zapret2
# release archive pinned by SHA-256 in tools/bundle/zapret2.lock.json (bundle.py --strict checks it), and for the
# page check the Chromium headless shell that the bundled Playwright version installs (Chrome for Testing).
# Packages go straight to a draft release (release assets do not count against the Actions artifact quota); the
# last job adds SHA256SUMS.txt and publishes it. A manual run is a dry run unless "publish" is ticked: then it
# releases v<version>, creating the tag on the commit it ran on if the tag does not exist yet.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v'
        required: true
        default: '0.0.0-test'
      publish:
        description: 'Publish the release v<version> (otherwise a dry run: packages are built, no release is made)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AVALONIA_TELEMETRY_OPTOUT: 1
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
  GH_REPO: ${{ github.repository }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet test ZapretAutoTuner.slnx -c Release

  draft:
    name: Draft release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.PUBLISH == 'true'
      - name: Notes and draft
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          lock = json.load(open("tools/bundle/zapret2.lock.json"))
          v = os.environ["VERSION"].removeprefix("v")
          notes = f"""Zapret2 AutoTuner {v}

          Движок: zapret2 {lock['version']} ({lock['repo']} {lock['tag']}), архив SHA-256 `{lock['sha256']}`.
          В релизе только официальные бинарники апстримов. Телеметрии нет.
          Engine: zapret2 {lock['version']}, official upstream binaries only. No telemetry.

          Для проверки страниц в комплекте свой браузер (Chromium headless shell из Playwright, папка `browsers`); установленные у вас браузеры программа не запускает.
          The page check uses the bundled browser (Playwright's Chromium headless shell, the `browsers` folder); your installed browsers are never started.

          - Windows: `*-setup.exe` (установщик) или `*-portable.zip`. Антивирус может ругаться на WinDivert: это драйвер перехвата из zapret2, см. docs/USER.md.
          - Linux: `.deb`, `.rpm` или `.tar.gz`. Нужны nftables (или iptables) и polkit.
          - Проверка файлов: `SHA256SUMS.txt`.
          - Права администратора: для работы с правами безопаснее установщик, `.deb` или `.rpm`; portable-архив распакуйте в папку, которую могут менять только администраторы (см. docs/USER.md).
          - Admin rights: for privileged use the installer, `.deb` or `.rpm` are the safe choice; unpack a portable archive only into a folder only administrators can write (see docs/USER.md).
          """
          open("notes.md", "w").write(notes)
          PY
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            # a release made by hand on GitHub for this tag: keep it, fill it in
            gh release edit "$TAG" --title "Zapret2 AutoTuner ${TAG#v}" --notes-file notes.md $pre
          else
            gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Zapret2 AutoTuner ${TAG#v}" --notes-file notes.md $pre
          fi

  package:
    name: Package ${{ matrix.rid }}
    needs: draft
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: linux-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Version
        shell: bash
        run: echo "VER=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Bundle zapret2 (official release, pinned)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/bundle/bundle.py --rid ${{ matrix.rid }} --strict
      - name: Publish
        shell: bash
        run: |
          out="artifacts/publish/ZapretAutoTuner"
          for p in src/ZapretAutoTuner.App/ZapretAutoTuner.App.csproj src/ZapretAutoTuner.Agent/ZapretAutoTuner.Agent.csproj; do
            dotnet publish "$p" -c Release -r ${{ matrix.rid }} --self-contained true -p:Version="$VER" -o "$out"
          done
          cp README.md docs/USER.md "$out/" 2>/dev/null || true
      - name: Browser for the page check (Playwright Chromium headless shell)
        shell: bash
        run: |
          # the L3 check runs in the program's own browser, never in the user's: Playwright's build, next to the app
          out="artifacts/publish/ZapretAutoTuner"
          node=$(ls "$out"/.playwright/node/*/node "$out"/.playwright/node/*/node.exe 2>/dev/null | head -1)
          PLAYWRIGHT_BROWSERS_PATH="$(pwd -W 2>/dev/null || pwd)/$out/browsers" "$node" "$out/.playwright/package/cli.js" install --only-shell --no-progress chromium
          rm -rf "$out/browsers/.links"
          find "$out/browsers" -type f \( -name 'chrome-headless-shell*' -o -name 'headless_shell*' \) | grep .

      - name: Engine and Agent start
        shell: bash
        run: |
          out="artifacts/publish/ZapretAutoTuner"
          if [ "${{ runner.os }}" = "Windows" ]; then
            "$out/zapret2/winws2.exe" --version | tee v.txt; "$out/ztuner-agent.exe" --version
          else
            "$out/zapret2/nfqws2" --version | tee v.txt; "$out/ztuner-agent" --version
          fi
          grep -q "lua_compat_ver 6" v.txt

      - name: Windows installer and portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path artifacts/publish/ZapretAutoTuner -DestinationPath "dist/ZapretAutoTuner-$env:VER-win-x64-portable.zip"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=$env:VER" "/DPublishDir=$PWD\artifacts\publish\ZapretAutoTuner" "/DOutDir=$PWD\dist" packaging\windows\autotuner.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          packaging/linux/build.sh ${{ matrix.rid }} "$VER" artifacts/publish/ZapretAutoTuner dist

      - name: Upload to the draft release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # a dry run keeps the packages for a day, when the artifact quota allows
        if: env.PUBLISH != 'true'
        continue-on-error: true
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub release
    needs: package
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir dist && cd dist
          gh release download "$TAG" --clobber
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false
