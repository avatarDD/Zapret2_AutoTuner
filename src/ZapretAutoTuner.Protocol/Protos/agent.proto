syntax = "proto3";

option csharp_namespace = "ZapretAutoTuner.Protocol";

package ztuner.agent.v1;

// Privileged helper API (PLAN.md §2, phase 1.1). The UI runs unprivileged and talks to the Agent over a
// named pipe (Windows) or a unix socket (Linux). Every call carries the session token in the
// "x-ztuner-token" metadata header. If heartbeats stop for HEARTBEAT_TIMEOUT or the UI process exits, the
// Agent stops every engine and capture, removes its firewall rules, restores sysctls and exits.
service Agent {
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);

  // Runs the engine with --dry-run, then with --intercept=0 (nfqws2-engine §9). No interception.
  rpc CheckEngineArgs (CheckEngineArgsRequest) returns (CheckEngineArgsReply);

  // Starts one engine instance. On Linux the queue rule is added to the Agent's nft table (or iptables chain)
  // for as long as the instance runs.
  rpc StartEngine (StartEngineRequest) returns (StartEngineReply);
  rpc StopEngine (StopEngineRequest) returns (StopEngineReply);

  // Engine stdout/stderr lines from the start (buffered) and then live, until the engine exits.
  rpc WatchEngine (WatchEngineRequest) returns (stream EngineOutput);

  // Packet capture into a ring buffer, returned as pcapng in chunks on stop.
  rpc StartCapture (StartCaptureRequest) returns (StartCaptureReply);
  rpc StopCapture (StopCaptureRequest) returns (stream CaptureChunk);

  // TCP/UDP endpoints owned by a process (ProcessTracker, "choose a program" targets).
  rpc ListConnections (ListConnectionsRequest) returns (ListConnectionsReply);

  // Replaces the AutoTuner block of the system hosts file (dpi-diagnostics §2a) after a backup, then flushes
  // the DNS cache. An empty list removes the block. Pins stay after the Agent exits: they are the user's choice.
  rpc PinHosts (PinHostsRequest) returns (PinHostsReply);
  rpc ListHostsPins (ListHostsPinsRequest) returns (ListHostsPinsReply);

  // winws2 as a Windows service from a winws2 export (PLAN 5.3): files go to a directory only administrators can
  // write, relative paths become absolute, the config passes the precheck first. The service stays after the Agent
  // exits: installing it is the user's explicit choice. Windows only (FailedPrecondition elsewhere).
  rpc InstallService (InstallServiceRequest) returns (ServiceReply);
  rpc RemoveService (RemoveServiceRequest) returns (ServiceReply);
  rpc QueryService (QueryServiceRequest) returns (ServiceReply);

  // geneva_c, the second bypass engine (skill geneva, its docs/INTEGRATION.md). The UI sends typed settings, never a
  // command line: the Agent builds it (Core.Geneva.GenevaArgv), checks the strategy with "geneva check", keeps the
  // checkpoint and the strategy database in its own protected folder and stops geneva (rules removed) when it exits.
  // At most one search and one run at a time.
  rpc GenevaStart (GenevaStartRequest) returns (GenevaStartReply);
  rpc GenevaStop (GenevaStopRequest) returns (GenevaStopReply);
  // geneva's events (JSON Lines) from the start (buffered) and then live, its log lines, and the exit.
  rpc GenevaWatch (GenevaWatchRequest) returns (stream GenevaOutput);
  // The answer to an eval_request of a search (the UI ran the probe from the request's local ports).
  rpc GenevaAnswer (GenevaAnswerRequest) returns (GenevaAnswerReply);
  // A command for a running "geneva run" over its control socket: stats, pause, resume, reset_stats, set_strategy.
  rpc GenevaControl (GenevaControlRequest) returns (GenevaControlReply);
  // What the Agent keeps: the version, the saved searches (resume) and the best strategies of the database.
  rpc GenevaInfo (GenevaInfoRequest) returns (GenevaInfoReply);

  // Stops everything, removes rules and exits.
  rpc Shutdown (ShutdownRequest) returns (ShutdownReply);
}

message HeartbeatRequest {
  int32 ui_pid = 1;
}

message HeartbeatReply {
  string agent_version = 1;
  int32 agent_pid = 2;
  bool elevated = 3;
  string platform = 4;          // linux | windows
  string firewall_backend = 5;  // nft | iptables | windivert | none
  string zapret2_version = 6;   // engine --version, empty if the engine was not found
  repeated string engines = 7;  // running engine ids
  repeated string captures = 8; // running capture ids
}

message CheckEngineArgsRequest {
  repeated string argv = 1;
  // See StartEngineRequest.lua_files.
  map<string, bytes> lua_files = 2;
}

message CheckEngineArgsReply {
  bool ok = 1;
  // "validator", "policy", "dry-run" or "intercept=0": the stage that failed; empty when ok.
  string stage = 2;
  repeated string output = 3;
}

message QueueRule {
  int32 queue_num = 1;
  string tcp_ports = 2;
  string udp_ports = 3;
  repeated string targets = 4;  // IP addresses; empty means any address
  bool incoming = 5;
}

message StartEngineRequest {
  repeated string argv = 1;
  // Linux only: the firewall rule feeding this instance. Its queue_num must equal --qnum.
  QueueRule queue = 2;
  // A label for logs, e.g. "probe:youtube.com".
  string tag = 3;
  // The content of every --lua-init=@path and --blob=name:[+ofs]@path file outside the Agent's engine directory,
  // keyed by that path exactly as it appears in argv. The Agent never loads such a path itself (nfqws2 reads blobs as
  // root, before dropping privileges, and a symlink in the user's folder could point anywhere): it checks the content
  // once, writes it into its own protected folder and runs the engine against the copy. Such a path without its
  // content here is refused (stage "engine": the UI could not read it).
  map<string, bytes> lua_files = 4;
}

message StartEngineReply {
  string engine_id = 1;
  int32 pid = 2;
}

message StopEngineRequest {
  string engine_id = 1;
}

message StopEngineReply {
  bool was_running = 1;
  int32 exit_code = 2;
}

message WatchEngineRequest {
  string engine_id = 1;
}

message EngineOutput {
  string line = 1;
  bool exited = 2;     // last message: the engine exited
  int32 exit_code = 3;
}

message StartCaptureRequest {
  repeated string addresses = 1;  // capture only packets to/from these IPs; empty means all
  repeated int32 ports = 2;       // and only these ports (either direction); empty means all
  int64 max_bytes = 3;            // ring buffer size; 0 means the default (32 MiB)
  int32 snaplen = 4;              // 0 means 65535
  string interface = 5;           // Linux: interface name; empty means all
}

message StartCaptureReply {
  string capture_id = 1;
}

message StopCaptureRequest {
  string capture_id = 1;
}

message CaptureChunk {
  bytes data = 1;
  int64 packets = 2;   // set in the last chunk
  int64 dropped = 3;   // packets evicted from the ring buffer
}

message ListConnectionsRequest {
  int32 pid = 1;
}

message Connection {
  string protocol = 1;  // tcp | udp
  string local_address = 2;
  int32 local_port = 3;
  string remote_address = 4;
  int32 remote_port = 5;
  string state = 6;
}

message ListConnectionsReply {
  repeated Connection connections = 1;
}

message HostsPin {
  string host = 1;
  string address = 2;
}

message PinHostsRequest {
  repeated HostsPin pins = 1;
}

message PinHostsReply {
  string backup_path = 1;   // copy of the hosts file before the change
  bool dns_flushed = 2;
  repeated HostsPin pins = 3;
}

message ListHostsPinsRequest {
}

message ListHostsPinsReply {
  string path = 1;
  repeated HostsPin pins = 2;
}

message ShutdownRequest {
}

message ShutdownReply {
}

message InstallServiceRequest {
  // A winws2 export: zt-config.txt, lists/*, files/* (relative paths, '/' separators).
  map<string, bytes> files = 1;
}

message RemoveServiceRequest {
}

message QueryServiceRequest {
}

message ServiceReply {
  bool installed = 1;
  bool running = 2;
  string directory = 3;
  string output = 4;
}

message GenevaStartRequest {
  string mode = 1;              // "run" or "evolve"
  // run
  string strategy = 2;
  string ports = 3;             // "80,443"
  // evolve
  string host = 4;
  int32 port = 5;
  int32 population = 6;
  int32 generations = 7;
  bool resume = 8;
  repeated string seeds = 9;    // strategies the population starts from
  string tag = 10;
}

message GenevaStartReply {
  string id = 1;
  int32 pid = 2;
  string strategy = 3;          // run: the canonical form geneva checked
}

message GenevaStopRequest {
  string id = 1;
}

message GenevaStopReply {
  bool was_running = 1;
  int32 exit_code = 2;
}

message GenevaWatchRequest {
  string id = 1;
}

message GenevaOutput {
  string event = 1;             // one JSON event, or empty
  string log = 2;               // one log line (stderr), or empty
  bool exited = 3;              // last message
  int32 exit_code = 4;
}

message GenevaAnswerRequest {
  string id = 1;
  int64 request_id = 2;
  int32 fitness = 3;
  string detail = 4;
}

message GenevaAnswerReply {
}

message GenevaControlRequest {
  string id = 1;
  string cmd = 2;
  string strategy = 3;          // set_strategy
}

message GenevaControlReply {
  bool ok = 1;
  string json = 2;              // geneva's answer
}

message GenevaInfoRequest {
}

message GenevaSavedSearch {
  string target = 1;            // external:host:port
  int64 saved_ms = 2;
}

message GenevaDbEntry {
  string strategy = 1;
  string target = 2;
  int32 runs = 3;
  int32 ok = 4;
  double best_fitness = 5;
  double avg_fitness = 6;
  int64 last_ok_ms = 7;
}

message GenevaInfoReply {
  string version_json = 1;      // geneva version --json, empty when geneva is missing
  repeated string problems = 2; // why geneva cannot run (missing, hashes)
  repeated GenevaSavedSearch searches = 3;
  repeated GenevaDbEntry best = 4;
  repeated string running = 5;  // ids
}
